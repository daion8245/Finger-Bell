; 핑거벨 가족 내선. 앱은 고른 사용자 이름(senior / child / guardian)으로 등록합니다.
; 시연용 비밀번호(앱의 FINGERBELL_SIP_PASSWORD와 같아야 함)입니다. 같은 Wi-Fi 안에서만 쓰세요.

[transport-ws]
type=transport
protocol=ws
bind=0.0.0.0

[family-endpoint](!)
type=endpoint
context=family
message_context=family-text
disallow=all
allow=opus,ulaw
webrtc=yes
dtls_auto_generate_cert=yes

[family-auth](!)
type=auth
auth_type=userpass
password=fingerbell-demo

[family-aor](!)
type=aor
; 한 사람은 기기 하나: 마지막으로 그 사용자를 고른 기기가 전화·문자를 받습니다.
max_contacts=1
remove_existing=yes

[senior](family-aor)
[senior](family-auth)
username=senior
[senior](family-endpoint)
auth=senior
aors=senior

[child](family-aor)
[child](family-auth)
username=child
[child](family-endpoint)
auth=child
aors=child

[guardian](family-aor)
[guardian](family-auth)
username=guardian
[guardian](family-endpoint)
auth=guardian
aors=guardian
